services:
  - type: web
    name: billionaire-circle
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.2
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_FILE
        value: /var/data/billionaire-circle.sqlite
    disk:
      name: billionaire-circle-data
      mountPath: /var/data
      sizeGB: 1
